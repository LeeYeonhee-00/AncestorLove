<title>조상사랑 - 예초 벌초 매칭 서비스</title>
<style>
body, h1, h2, h3, h4, h5, h6 {
    font-family: "Lato", sans-serif
}

.w3-bar, h1, button {
    font-family: "Lato", sans-serif
}

table {
    margin: auto;
}

input[type="text"] {
    border: 1.5px rgb(68, 136, 244) solid;
    width: 500px;
    height: 30px;
    border-radius: 5px;
    padding-left: 10px;
}

textarea {
    border: 1.5px rgb(68, 136, 244) solid;
    width: 500px;
    height: 400px;
    border-radius: 5px;
    padding-left: 10px;
    padding-top: 10px;
    resize: none;
}

.header {
    height: 30px;
}

input[type="submit"] {
    width: 100px;
    height: 40px;
    font-size: 15px;
    border: 0;
    outline: 1.5px rgb(68, 136, 244) solid;
    border-radius: 5px;
    padding-left: 10px;
    background-color: rgb(164, 199, 255);
}

input[type="submit"]:active {
    width: 100px;
    height: 40px;
    font-size: 15px;
    border: 0;
    border-radius: 5px;
    outline: 1.5px rgb(27, 76, 155) solid;
    padding-left: 10px;
    background-color: rgb(68, 136, 244);
}

.footer {
    position: relative;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    background-color: #f1f1f1; 
}

</style>
</head>

<!-- 네비게이션 바 -->
<div class="w3-top">
    <div class="w3-bar w3-light-green w3-card w3-left-align w3-large">
        <a class="w3-bar-item w3-button w3-hide-medium w3-hide-large w3-right w3-padding-large w3-hover-white w3-large w3-red" href="javascript:void(0);" title="Toggle Navigation Menu"><i class="fa fa-bars"></i></a> 
        <a href="main.html" class="w3-bar-item w3-button w3-padding-large w3-hover-white w3-green">Home</a>
        <a href="list.html" class="w3-bar-item w3-button w3-hide-small w3-padding-large w3-hover-white">의뢰 게시판</a> 
        <a href="partner.html" class="w3-bar-item w3-button w3-hide-small w3-padding-large w3-hover-white">파트너</a>
        <a href="partnerdashboard.html" class="w3-bar-item w3-button w3-hide-small w3-padding-large w3-hover-white">파트너 정보</a>
        <div id="loginSection" class="w3-right"></div>
    </div>
</div>

<body>
    <form id="requestForm">
        <table>
            <tr><td><h2>의뢰정보입력</h2></td></tr>
            <tr><td class="header">제목</td></tr>
            <tr><td><input type="text" placeholder="제목을 입력하세요" name="inquiryTitle"></td></tr>
            <tr><td class="header">작업주소</td></tr>
            <tr><td><input type="text" placeholder="작업 주소를 입력하세요" name="inquiryAddress"></td></tr>
            <tr><td class="header">작업날짜</td></tr>
            <tr><td><input type="datetime-local" name="inquiryDate"></td></tr>
            <tr><td class="header">작업유형</td></tr>
            <tr><td><select name="workId">
                    <option value="1">예초</option>
                    <option value="2">벌초</option>
                    <option value="3">정원관리</option>
                </select></td></tr>
            <tr><td class="header">의뢰내용</td></tr>
            <tr><td><textarea placeholder="의뢰내용을 입력하세요" name="inquiryContent"></textarea></td></tr>
            <tr><td style="text-align: right;"><input type="submit" value="게시하기"></td></tr>
        </table>
    </form>

<script>
// 폼 제출 처리 함수
document.getElementById('requestForm').addEventListener('submit', function(event) {
    event.preventDefault(); // 기본 폼 제출을 막음

    const inquiryTitle = document.getElementsByName('inquiryTitle')[0].value.trim();
    const inquiryAddress = document.getElementsByName('inquiryAddress')[0].value.trim();
    const inquiryDate = document.getElementsByName('inquiryDate')[0].value.trim();
    const workId = document.querySelector('select[name="workId"]').value;
    const inquiryContent = document.getElementsByName('inquiryContent')[0].value.trim();

    if (!inquiryTitle || !inquiryAddress || !inquiryDate || !workId || !inquiryContent) {
        alert('오류: 모든 필드를 입력해주세요.');
        return;
    }

    const submitButton = document.querySelector('input[type="submit"]');
    submitButton.disabled = true; // 폼 제출 후 버튼 비활성화

    // 서버로 폼 데이터 전송
    fetch('inquiry', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            inquiryTitle: inquiryTitle,
            inquiryAddress: inquiryAddress,
            inquiryDate: inquiryDate,
            workId: workId,
            inquiryContent: inquiryContent
        }),
    })
    .then(response => response.text())
    .then(data => {
        alert('성공적으로 게시되었습니다.');
        window.location.href = 'list.html'; // 게시 후 페이지 이동
    })
    .catch(error => {
        console.error('Error:', error);
        alert('오류가 발생했습니다.');
        submitButton.disabled = false; // 오류 발생 시 버튼 다시 활성화
    });
});
</script>

<footer class="w3-container w3-padding-16 w3-center w3-opacity footer">

</body>
</html>
